name: Build iOS IPA (Capacitor)

on:
  workflow_dispatch:        # 在 GitHub 网页上点一下就能触发
  push:
    branches: [ main ]

jobs:
  ios:
    runs-on: macos-latest   # GitHub 提供的云 Mac
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Decode signing files
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          MOBILEPROV_BASE64: ${{ secrets.MOBILEPROV_BASE64 }}
        run: |
          echo "$P12_BASE64" | base64 -d > /tmp/cert.p12
          echo "$MOBILEPROV_BASE64" | base64 -d > /tmp/profile.mobileprovision

          # 从描述文件里提取 Team ID、Profile 名称、UUID、导出方式
          security cms -D -i /tmp/profile.mobileprovision > /tmp/profile.plist 2>/dev/null
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" /tmp/profile.plist 2>/dev/null)
          if [ -z "$TEAM_ID" ]; then
            TEAM_ID=$(grep -a -A1 '<key>TeamIdentifier</key>' /tmp/profile.mobileprovision | grep -o '[A-Z0-9]\{10\}' | head -1)
          fi
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /tmp/profile.plist 2>/dev/null)
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /tmp/profile.plist 2>/dev/null)

          # 根据描述文件类型判断导出方式：ProvisionsAllDevices=true 是 ad-hoc，否则按 development
          if [ "$(/usr/libexec/PlistBuddy -c 'Print :ProvisionsAllDevices' /tmp/profile.plist 2>/dev/null)" = "true" ]; then
            EXPORT_METHOD="ad-hoc"
          else
            EXPORT_METHOD="development"
          fi

          echo "TEAM_ID=$TEAM_ID"
          echo "PROFILE_NAME=$PROFILE_NAME"
          echo "PROFILE_UUID=$PROFILE_UUID"
          echo "EXPORT_METHOD=$EXPORT_METHOD"
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "EXPORT_METHOD=$EXPORT_METHOD" >> "$GITHUB_ENV"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp /tmp/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Import certificate to keychain
        env:
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          security create-keychain -p "" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security unlock-keychain -p "" build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/xcodebuild -f pkcs12
          security list-keychains -d user -s build.keychain
          security default-keychain -s build.keychain

          # 从钥匙串里读取签名证书名称（Codesign 身份）
          SIGN_IDENTITY=$(security find-identity -v -p codesigning build.keychain | grep -o '"[^"]*"' | head -1 | tr -d '"')
          echo "SIGN_IDENTITY=$SIGN_IDENTITY"
          echo "SIGN_IDENTITY=$SIGN_IDENTITY" >> "$GITHUB_ENV"

      - name: Build & archive (manual signing)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath build/App.xcarchive archive CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=$TEAM_ID CODE_SIGN_IDENTITY="$SIGN_IDENTITY" PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"

      - name: Export IPA
        run: |
          cd ios/App
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>$EXPORT_METHOD</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamId</key><string>$TEAM_ID</string>
            <key>signingCertificate</key><string>$SIGN_IDENTITY</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.yi.fitness</key><string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportOptionsPlist ExportOptions.plist -exportPath build/ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: fitness-ipa
          path: ios/App/build/ipa/*.ipa
